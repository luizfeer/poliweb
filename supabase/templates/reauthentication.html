<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme que é você</title>
  </head>
  <body
    style="
      margin: 0;
      background: #faf8f5;
      color: #191919;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #faf8f5; padding: 28px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 600px;
              background: #ffffff;
              border: 1px solid #e4e4e4;
              border-radius: 18px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="background: #1f4a2c; padding: 22px 24px; color: #ffffff">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 12px;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    color: #e1eede;
                  "
                >
                  Portal Carmelitano
                </p>
                <h1
                  style="
                    margin: 0;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 28px;
                    line-height: 1.15;
                    font-weight: 700;
                  "
                >
                  Confirme que é você
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 24px 8px">
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.55">
                  Para continuar uma ação sensível no Portal Carmelitano, informe este código:
                </p>
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  style="
                    background: #fff1e8;
                    border: 1px solid #ffd9bf;
                    border-radius: 14px;
                    margin: 0 0 22px;
                  "
                >
                  <tr>
                    <td align="center" style="padding: 22px 16px">
                      <p
                        style="
                          margin: 0;
                          font-family: 'JetBrains Mono', Consolas, monospace;
                          font-size: 32px;
                          letter-spacing: 0.16em;
                          font-weight: 700;
                          color: #9c3608;
                        "
                      >
                        {{ .Token }}
                      </p>
                    </td>
                  </tr>
                </table>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5a5a5a">
                  Não compartilhe este código. Se você não tentou fazer essa ação, ignore o email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 22px 24px 26px">
                <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #9a9a9a">
                  Portal Carmelitano - Carmo do Rio Claro/MG<br /><a
                    href="{{ .SiteURL }}"
                    style="color: #0f4c81; text-decoration: none"
                    >{{ .SiteURL }}</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
