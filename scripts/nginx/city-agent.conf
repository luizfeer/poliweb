# Exemplo: /etc/nginx/sites-available/agent.luizalmeida.dev
# symlink: sudo ln -s /etc/nginx/sites-available/agent.luizalmeida.dev /etc/nginx/sites-enabled/
#
# city-agent escuta em 127.0.0.1:8787 (PM2, fork mode)
# Nginx faz proxy reverso + SSL (Certbot)

server {
    listen 80;
    server_name agent.luizalmeida.dev;

    # Certbot irá inserir o bloco de redirect para 443 automaticamente
    # após rodar: sudo certbot --nginx -d agent.luizalmeida.dev

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos porque o agente pode demorar a responder
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
